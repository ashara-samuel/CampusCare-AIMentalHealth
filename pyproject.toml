[project]
name = "campuscare"
version = "1.0.0"
description = "Student wellbeing companion — scoped, safe, auditable."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# FastAPI's dependency-injection idiom: Depends()/Security() in defaults is correct.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# conftest sets os.environ before importing the app, so imports can't be top-of-file.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
