services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment}
      DATABASE_URL: postgresql+psycopg://campuscare:${DB_PASSWORD:-campuscare}@db:5432/campuscare
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuscare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campuscare}
      POSTGRES_DB: campuscare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
