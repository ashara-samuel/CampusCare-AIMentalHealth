# Render Blueprint — one-click deploy of CampusCare (web service + Postgres).
# In Render: New → Blueprint → connect this repo → Apply. Then set the two secret
# keys in the dashboard (OpenAI / ElevenLabs are optional; the app runs without
# them — safe fallback reply, text-only voice).

services:
  - type: web
    name: campuscare
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong value
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString # postgresql://... (normalized to psycopg3 in db.py)
      - key: OPENAI_API_KEY
        sync: false                  # set in dashboard (optional)
      - key: ELEVENLABS_API_KEY
        sync: false                  # set in dashboard (optional)

databases:
  - name: campuscare-db
    plan: free
    databaseName: campuscare
    user: campuscare
